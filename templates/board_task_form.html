{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto fade-up">
    <div class="mb-6">
        <a href="{{ url_for('board') }}" class="inline-flex items-center gap-1.5 text-sm text-gray-400 hover:text-gray-600 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
            Board
        </a>
    </div>

    <div class="bg-white rounded-2xl border border-gray-200/60 shadow-sm p-8">
        <h1 class="font-headline text-xl font-bold text-gray-900 mb-6">Neuer Task</h1>

        <form method="POST" action="{{ url_for('board_task_new') }}">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                
                <div class="lg:col-span-2 space-y-5">
                    <div>
                        <label class="text-xs font-semibold text-gray-500 mb-1.5 block">Titel *</label>
                        <input type="text" name="title" required maxlength="500"
                               class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-petrol-200 focus:border-indigo-300"
                               placeholder="Was soll erledigt werden?">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-500 mb-1.5 block">Beschreibung</label>
                        <textarea name="description" rows="6"
                                  class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-petrol-200 focus:border-indigo-300"
                                  placeholder="Details, Kontext, Anforderungen..."></textarea>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-500 mb-1.5 block">Tags</label>
                        <input type="text" name="tags"
                               class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-petrol-200 focus:border-indigo-300"
                               placeholder="Kommagetrennt: SEO, partneragentur, Q2">
                    </div>
                </div>

                
                <div class="space-y-4">
                    <div>
                        <label class="text-xs font-semibold text-gray-500 mb-1.5 block">Status</label>
                        <select name="status" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-petrol-200">
                            
                            {% set vorauswahl = preselect_status if preselect_status in stages|map('first') else 'backlog' %}
                            {% for val, label, _ in stages %}
                            <option value="{{ val }}" {% if vorauswahl == val %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-500 mb-1.5 block">Priorität</label>
                        <select name="priority" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-petrol-200">
                            {% for val, label in priority_options %}
                            <option value="{{ val }}" {% if val == 'mittel' %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-500 mb-1.5 block">Aufwand</label>
                        <select name="effort" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-petrol-200">
                            <option value="">—</option>
                            {% for val, label in effort_options %}
                            <option value="{{ val }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-500 mb-1.5 block">Impact</label>
                        <select name="impact" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-petrol-200">
                            <option value="">—</option>
                            {% for val, label in impact_options %}
                            <option value="{{ val }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-500 mb-1.5 block">Kategorie</label>
                        <input type="text" name="category" list="cat-list-form"
                               class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-petrol-200"
                               placeholder="z.B. Feature, Bug, Idee">
                        <datalist id="cat-list-form"></datalist>
                        <script>fetch('/board/api/categories').then(r=>r.json()).then(cats=>{const dl=document.getElementById('cat-list-form');cats.forEach(c=>{const o=document.createElement('option');o.value=c;dl.appendChild(o)})});</script>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-500 mb-1.5 block">Fällig am</label>
                        <input type="date" name="due_date" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-petrol-200">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-500 mb-1.5 block">Wiederholung</label>
                        <select name="recurrence_days" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-petrol-200">
                            <option value="">— Keine —</option>
                            {% for days, label in recurrence_presets %}
                            <option value="{{ days }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-500 mb-1.5 block">Kontakt</label>
                        <div x-data="{
                            contactId: '{{ preselect_contact or '' }}',
                            contactSearch: '',
                            showContacts: false,
                            contacts: [{% for c in contacts %}{id: {{ c.id }}, name: {{ c.display_name | tojson | forceescape }}}{{ ',' if not loop.last }}{% endfor %}],
                            get contactsFiltered() {
                                if (!this.contactSearch) return this.contacts;
                                const q = this.contactSearch.toLowerCase();
                                return this.contacts.filter(c => c.name.toLowerCase().includes(q));
                            },
                            selectContact(c) { this.contactId = c.id; this.contactSearch = c.name; this.showContacts = false; },
                            init() { const f = this.contacts.find(c => c.id == this.contactId); if (f) this.contactSearch = f.name; }
                        }">
                            <div class="relative" @click.outside="showContacts = false">
                                <input type="hidden" name="contact_id" value="{{ preselect_contact or '' }}" :value="contactId">
                                <input type="text"
                                       x-model="contactSearch"
                                       @focus="showContacts = true"
                                       @input="showContacts = true; if (!contactSearch) contactId = ''"
                                       placeholder="Kontakt suchen..."
                                       autocomplete="off"
                                       class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-petrol-200">
                                <div x-show="showContacts"
                                     class="absolute z-50 mt-1 w-full bg-white border border-gray-200 rounded-xl shadow-lg max-h-48 overflow-y-auto">
                                    <template x-for="c in contactsFiltered" :key="c.id">
                                        <div @mousedown.prevent @click="selectContact(c)"
                                             class="px-3 py-2 text-sm cursor-pointer hover:bg-petrol-50 transition-colors"
                                             :class="contactId == c.id ? 'bg-petrol-50 text-petrol-600 font-medium' : 'text-gray-700'"
                                             x-text="c.name"></div>
                                    </template>
                                    <div x-show="contactsFiltered.length === 0" class="px-3 py-2 text-sm text-gray-400 italic">Kein Kontakt gefunden</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-500 mb-1.5 block">Erstellt von</label>
                        <select name="created_by" class="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-petrol-200">
                            {% for opt in created_by_options %}
                            <option value="{{ opt }}">{{ opt }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-3 mt-8 pt-6 border-t border-gray-100">
                <a href="{{ url_for('board') }}" class="px-5 py-2.5 text-sm text-gray-500 hover:text-gray-700 transition-colors">Abbrechen</a>
                <button type="submit" class="px-6 py-2.5 bg-gradient-to-b from-petrol-500 to-petrol-600 text-white text-sm font-semibold rounded-xl shadow-sm hover:from-petrol-600 hover:to-petrol-700 transition-all duration-200">Task erstellen <span class="text-petrol-200 text-[10px] ml-1">Ctrl+S</span></button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        document.querySelector('form[method="POST"]').submit();
    }
});
</script>
{% endblock %}
