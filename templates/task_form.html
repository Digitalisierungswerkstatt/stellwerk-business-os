{% extends "base.html" %}

{% block title %}Neue Aufgabe - Sales CRM{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Neue Aufgabe</h1>
    </div>

    <form method="POST" class="bg-white rounded-lg shadow p-6 space-y-6">
        <div>
            <label for="contact_id" class="block text-sm font-medium text-gray-700 mb-1">Kontakt *</label>
            <select name="contact_id" id="contact_id" required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <option value="">Kontakt auswählen...</option>
                {% for contact in contacts %}
                <option value="{{ contact.id }}" {% if selected_contact_id|string == contact.id|string %}selected{% endif %}>
                    {{ contact.display_name }}{% if contact.full_name and contact.firmenname %} ({{ contact.full_name }}){% endif %}
                </option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Aufgabe *</label>
            <input type="text" name="title" id="title" required
                   placeholder="z.B. Angebot nachfassen"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <div>
            <label for="due_date" class="block text-sm font-medium text-gray-700 mb-1">Fällig am</label>
            <input type="date" name="due_date" id="due_date"
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        </div>

        <div class="flex justify-between items-center pt-4 border-t border-gray-200">
            <a href="{{ url_for('tasks') }}" class="text-gray-600 hover:text-gray-900">Abbrechen</a>
            <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium">
                Erstellen
            </button>
        </div>
    </form>
</div>
{% endblock %}
